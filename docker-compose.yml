services:
  receiver:
    deploy: 
      replicas: 3
    build:
      context: receiver
      dockerfile: Dockerfile 
    depends_on:
      - kafka
    volumes:
      - ./config/receiver:/app/conf
      - ./logs:/app/logs
  storage:
    build:
      context: storage
      dockerfile: Dockerfile 
    environment:
      CORS_ALLOW_ALL: no
    depends_on:
      - kafka
      - db
    volumes: 
      - ./config/storage:/app/conf
      - ./logs:/app/logs
  processing:
    build:
      context: processing
      dockerfile: Dockerfile 
    environment:
      CORS_ALLOW_ALL: no
    depends_on:
      - storage 
    volumes: 
      - ./config/processing:/app/conf
      - ./logs:/app/logs
      - ./data/processing:/app/stats
  analyzer:
    build: 
      context: analyzer 
      dockerfile: Dockerfile 
    depends_on:
      - kafka
    volumes:
      - ./config/analyzer:/app/conf
      - ./logs:/app/logs
  anomaly_detector:
    build:
      context: anomaly_detector
      dockerfile: Dockerfile
    depends_on: 
      - kafka
    volumes:
      - ./config/anomaly:/app/conf
      - ./logs:app/logs
  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    depends_on: 
      - analyzer
      - processing
      - receiver 
      - storage
    ports:
      - "80:80"
    volumes: 
      - ./dashboard/nginx:/etc/nginx/conf.d
  zookeeper:
    image: wurstmeister/zookeeper
    hostname: zookeeper
  kafka:
    image: wurstmeister/kafka
    command: bash -c "rm -f /kafka/kafka-logs/meta.properties && start-kafka.sh"
    hostname: kafka
    environment:
      KAFKA_CREATE_TOPICS: "events:1:1" # topic:partition:replicas
      KAFKA_ADVERTISED_HOST_NAME: kafka #docker-machine ip
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - ./data/kafka/kafka-logs:/kafka/kafka-logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - "zookeeper"
  db:
    image: mysql
    env_file:
      - .env
    volumes:
      - ./data/database:/var/lib/mysql
volumes:
  my-db: