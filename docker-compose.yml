services:
  receiver:
    build:
      context: receiver
      dockerfile: Dockerfile 
    depends_on:
      - kafka
    ports: 
      - "8080:8080"
    volumes:
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\config\receiver:/app/conf
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\logs:/app/logs
  storage:
    build:
      context: storage
      dockerfile: Dockerfile 
    depends_on:
      - kafka
      - db
    volumes: 
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\config\storage:/app/conf
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\logs:/app/logs
  processing:
    build:
      context: processing
      dockerfile: Dockerfile 
    depends_on:
      - storage 
    ports:
      - "8100:8100"
    volumes: 
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\config\processing:/app/conf
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\logs:/app/logs
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\data\processing:/app/stats
  analyzer:
    build: 
      context: analyzer 
      dockerfile: Dockerfile 
    depends_on:
      - kafka
    ports:
      - "8101:8101"
    volumes:
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\config\analyzer:/app/conf
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\logs:/app/logs
  zookeeper:
    image: wurstmeister/zookeeper
    hostname: zookeeper
  kafka:
    image: wurstmeister/kafka
    command: [start-kafka.sh]
    hostname: kafka
    environment:
      KAFKA_CREATE_TOPICS: "events:1:1" # topic:partition:replicas
      KAFKA_ADVERTISED_HOST_NAME: kafka #docker-machine ip
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\data\kafka:/kafka
      - /var/run/docker.sock:/var/run/docker.sock
      - ./kafka_reset.sh:/kafka_reset.sh
    depends_on:
      - "zookeeper"
  db:
    image: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: user
      MYSQL_PASSWORD: loser
      MYSQL_DATABASE: trains_database
    volumes:
      - C:\Users\xsrpr\Desktop\BCIT\ACIT3855\3855-L4\data\database:/var/lib/mysql
volumes:
  my-db: