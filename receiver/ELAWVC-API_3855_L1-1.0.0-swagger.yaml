openapi: 3.0.0
info:
  version: 1.0.0
  title: Translink Skytrain Report API
  description: 'API for checking skytrain''s behaviours. '
paths:
  /rapidtransit/status:
    post:
      summary: Your POST endpoint
      tags: []
      responses:
        '201':
          description: Creation Success
        '400':
          description: Request Invalid.
      operationId: app.post_wait_time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/station_wait'
  /rapidtransit/maintenance:
    post:
      summary: Your POST endpoint
      tags: []
      responses:
        '201':
          description: Creation Success.
        '400':
          description: 'Request Invalid. '
      operationId: app.post_maintenance_yard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/maintenance_inventory'
    parameters: []
components:
  schemas:
    station_wait:
      type: object
      title: Station_Wait
      properties:
        station_ID:
          type: string
          format: uuid
        line_ID:
          type: string
          x-stoplight:
            id: r0hqucelx2xdd
        timestamp:
          type: string
          x-stoplight:
            id: sdf7jbdzflq29
        passenger_amount:
          type: integer
          x-stoplight:
            id: xfb2n20wsqw3z
    maintenance_inventory:
      title: maintenance_inventory
      type: object
      properties:
        maintenance_yard_id:
          type: string
          format: uuid
        model:
          type: string
          x-stoplight:
            id: 08kmjmalfsgtt
        timestamp:
          type: string
          x-stoplight:
            id: mllgp3rsfjwp2
        train_count:
          type: integer
          x-stoplight:
            id: uidxna1gx1rck